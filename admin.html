<!DOCTYPE html>
<html lang="es">
<head>
    <title>Admin - Legends Sprint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { background: #0a0a0a; color: #fff; font-family: 'Arial Black', sans-serif; text-align: center; padding: 20px; }
        .panel { background: rgba(255,255,255,0.05); border: 2px solid #EC0000; border-radius: 10px; padding: 20px; max-width: 800px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;}
        h1 { font-family: 'Press Start 2P', cursive; font-size: 20px; color: #EC0000; margin-bottom: 20px; width: 100%;}
        
        .btn { padding: 15px; font-family: 'Press Start 2P', cursive; font-size: 12px; cursor: pointer; background: transparent; color: #fff; border: 2px solid #555; transition: 0.3s; width: 45%; border-radius: 5px;}
        .btn:hover { background: #333; }
        .btn-primario { border-color: #00ffcc; color: #00ffcc; }
        .btn-primario:hover { background: #00ffcc; color: #000; }
        .btn-accion { border-color: #ffaa00; color: #ffaa00; }
        .btn-accion:hover { background: #ffaa00; color: #000; }
        .btn-peligro { border-color: #ff0055; color: #ff0055; }
        .btn-peligro:hover { background: #ff0055; color: #fff; }

        .stats-box { width: 100%; background: #111; border: 1px solid #333; padding: 20px; border-radius: 8px; margin-bottom: 20px;}
        .pin-display { font-size: 40px; font-family: 'Press Start 2P', cursive; color: #00ffcc; letter-spacing: 5px; margin: 10px 0;}
        .team-stats { display: flex; justify-content: space-around; font-family: 'Press Start 2P', cursive; font-size: 10px; color: #aaa;}
        .team-col span { display: block; font-size: 24px; color: #fff; margin-top: 10px; font-family: 'Arial Black';}
    </style>
</head>
<body>
    <div class="panel">
        <h1>CONTROL STAGE</h1>
        
        <div class="stats-box">
            <h3 style="margin-top: 0; color: #666; font-family: 'Press Start 2P', cursive; font-size: 12px;">SALA ACTIVA (PIN)</h3>
            <div class="pin-display" id="display-pin">----</div>
            <div class="team-stats" id="team-stats">
                <!-- Estadisticas inyectadas por JS -->
            </div>
        </div>

        <button class="btn btn-primario" onclick="abrirSala()">1. CREAR NUEVA SALA (PIN)</button>
        <button class="btn btn-accion" onclick="mezclarEquipos()">2. MEZCLAR EQUIPOS</button>
        <button class="btn btn-primario" onclick="iniciarCarrera()" style="width: 93%; font-size: 16px;">3. INICIAR CARRERA</button>
        <button class="btn btn-accion" onclick="devolverLobby()">4. PAUSAR / VOLVER A LOBBY</button>
        <button class="btn btn-peligro" onclick="cerrarSala()">5. CERRAR SALA (EXPULSAR)</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAlvRSjQ8HMkYLqWdRnz8sHm6H1anXxNUw", authDomain: "hipodromo-56215.firebaseapp.com", databaseURL: "https://hipodromo-56215-default-rtdb.firebaseio.com", projectId: "hipodromo-56215", storageBucket: "hipodromo-56215.firebasestorage.app", messagingSenderId: "793993929295", appId: "1:793993929295:web:febbad383d625d60c3c03a" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const NOMBRES_EQUIPOS = { 1: "M. JACKSON", 2: "F. MERCURY", 3: "SLASH", 4: "D. BOWIE", 5: "WINEHOUSE" };

        onValue(ref(db, 'salaActiva'), (snap) => {
            document.getElementById('display-pin').innerText = snap.val() || "----";
        });

        onValue(ref(db, 'equipos'), (snap) => {
            const datos = snap.val() || {};
            const statsDiv = document.getElementById('team-stats');
            let html = '';
            [1,2,3,4,5].forEach(id => {
                const jgs = (datos[id] && datos[id].jugadores) ? Object.keys(datos[id].jugadores).length : 0;
                html += `<div class="team-col">${NOMBRES_EQUIPOS[id]}<span>${jgs}</span></div>`;
            });
            statsDiv.innerHTML = html;
        });

        window.abrirSala = () => {
            if(confirm("¿Crear una sala nueva? Esto borrará el juego actual.")) {
                const pin = Math.floor(1000 + Math.random() * 9000).toString();
                set(ref(db, 'salaActiva'), pin);
                const inicial = {};
                [1,2,3,4,5].forEach(id => { inicial[id] = { clicksTotales: 0, jugadores: null }; });
                set(ref(db, 'equipos'), inicial);
                set(ref(db, 'ganadorAbsoluto'), null);
                set(ref(db, 'clasificacion'), null);
                set(ref(db, 'estado'), 'espera'); 
            }
        };

        window.mezclarEquipos = async () => {
            if(confirm("¿Mezclar a todos los jugadores aleatoriamente?")) {
                const snap = await get(ref(db, 'equipos'));
                const datos = snap.val();
                if(!datos) return;
                
                let todosLosJugadores = [];
                [1,2,3,4,5].forEach(id => {
                    if(datos[id].jugadores) {
                        Object.entries(datos[id].jugadores).forEach(([uid, nombre]) => {
                            todosLosJugadores.push({uid, nombre});
                        });
                    }
                });

                for (let i = todosLosJugadores.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [todosLosJugadores[i], todosLosJugadores[j]] = [todosLosJugadores[j], todosLosJugadores[i]];
                }

                const nuevosEquipos = {};
                [1,2,3,4,5].forEach(id => { nuevosEquipos[id] = { clicksTotales: 0, jugadores: {} }; });
                
                todosLosJugadores.forEach((jugador, index) => {
                    const eqAsignado = (index % 5) + 1;
                    nuevosEquipos[eqAsignado].jugadores[jugador.uid] = jugador.nombre;
                });

                set(ref(db, 'equipos'), nuevosEquipos);
                set(ref(db, 'comandoResetCelulares'), Date.now()); 
            }
        };

        window.iniciarCarrera = () => {
            if(confirm("¿Cerrar ingresos y comenzar cuenta regresiva?")) {
                set(ref(db, 'clasificacion'), null); 
                set(ref(db, 'estado'), 'cuenta_regresiva');
            }
        };

        window.devolverLobby = () => {
            if(confirm("¿Detener la carrera y devolver a todos a la sala de espera manteniendo equipos?")) {
                set(ref(db, 'estado'), 'espera');
            }
        };

        window.cerrarSala = () => {
            if(confirm("¿Cerrar sala y expulsar a todos a la pantalla de inicio?")) {
                set(ref(db, 'salaActiva'), null);
                set(ref(db, 'estado'), 'cerrado');
            }
        }
    </script>
</body>
</html>
