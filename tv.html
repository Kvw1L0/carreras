<!DOCTYPE html>
<html lang="es">
<head>
    <title>Music Legends Sprint - TV</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root { --neon-red: #EC0000; --dark-bg: #050505; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Arial Black', sans-serif; margin: 0; overflow: hidden; transition: filter 1s ease-out; }
        
        #pista-container { width: 100vw; height: 100vh; position: relative; background: url('pista.png') center center / cover no-repeat; background-color: #111; transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1); will-change: transform; }
        
        /* Posicionamiento Absoluto para 2.5D */
        #zona-carriles { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .carril { position: absolute; width: 100%; height: 12vh; display: flex; align-items: center; transform: translateY(-50%); }
        
        .personaje { position: absolute; left: 0; height: 100%; transition: left 0.1s linear; z-index: 2; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); display: flex; align-items: center;}
        .personaje img { height: 100%; max-height: 12vh; display: block; }
        
        .meta { display: none; } /* Ocultamos la meta blanca generica, usaremos el laser rojo de tu imagen */

        .efecto-tension { filter: saturate(1.5) contrast(1.2) brightness(0.8); }

        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(5, 5, 5, 0.9); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:100; text-align: center; backdrop-filter: blur(5px); }
        
        #pantalla-desbloqueo { display: flex; z-index: 200; cursor: pointer; }
        #pantalla-desbloqueo h1 { font-family: 'Press Start 2P', cursive; color: var(--neon-red); animation: pulso 1s infinite alternate; }

        #titulo-inicio { font-size: 6vh; font-family: 'Press Start 2P', cursive; margin:0; color: #fff; text-shadow: 0 0 20px var(--neon-red); line-height: 1.5;}
        
        #contador-tv { font-size: 30vh; font-family: 'Press Start 2P', cursive; color: #fff; text-shadow: 0 0 50px var(--neon-red); display: none; animation: latido 1s infinite; line-height: 1; }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes pulso { from { transform: scale(1); } to { transform: scale(1.05); } }

        #overlay-ruleta { background: rgba(5, 5, 5, 0.95); z-index: 105; }
        #titulo-ruleta { color: #fff; font-size: 4vh; font-family: 'Press Start 2P', cursive; margin-bottom: 40px; }
        #nombre-ruleta { font-size: 12vh; font-family: 'Press Start 2P', cursive; color: #fff; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); transition: all 0.1s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90vw; }
        .ruleta-girando { opacity: 0.8; transform: scale(0.98); }
        .ruleta-ganador { color: var(--neon-red) !important; text-shadow: 0 0 40px var(--neon-red), 0 0 80px var(--neon-red) !important; animation: impactoGanador 0.5s ease-out forwards; }
        @keyframes impactoGanador { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1.05); } }

        .puesto { font-size: 3vh; font-family: 'Press Start 2P', cursive; margin: 15px; padding: 20px 40px; background: rgba(236,0,0,0.2); border: 2px solid var(--neon-red); width: 70%; display: flex; justify-content: space-between; color: white; align-items: center; box-shadow: 0 0 15px rgba(236,0,0,0.5); }
    </style>
</head>
<body>
    
    <!-- Pantalla para desbloquear el audio de HTML5 -->
    <div id="pantalla-desbloqueo" class="overlay" onclick="desbloquearSistema()">
        <h1>CLICK PARA INICIAR SISTEMA<br><br><span style="font-size: 2vh; color:#fff;">(Requerido para Audio)</span></h1>
    </div>

    <div id="pista-container">
        <div id="zona-carriles">
            <div class="meta"></div>
        </div>
    </div>

    <div id="overlay-inicio" class="overlay">
        <h1 id="titulo-inicio">ESCANEA EL QR<br><br>PARA UNIRTE</h1>
        <div id="contador-tv">3</div>
    </div>

    <div id="overlay-ruleta" class="overlay">
        <h2 id="titulo-ruleta">RANDOM WINNER</h2>
        <div id="nombre-ruleta">BUSCANDO...</div>
    </div>

    <div id="overlay-podio" class="overlay">
        <h1 style="font-size: 6vh; font-family: 'Press Start 2P', cursive; color: #fff; text-shadow: 0 0 20px var(--neon-red); margin-bottom: 40px;">RESULTADOS</h1>
        <div id="lista-podio" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlvRSjQ8HMkYLqWdRnz8sHm6H1anXxNUw",
            authDomain: "hipodromo-56215.firebaseapp.com",
            databaseURL: "https://hipodromo-56215-default-rtdb.firebaseio.com",
            projectId: "hipodromo-56215",
            storageBucket: "hipodromo-56215.firebasestorage.app",
            messagingSenderId: "793993929295",
            appId: "1:793993929295:web:febbad383d625d60c3c03a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Estructura adaptada a tu imagen. Ajusta los % de 'posicionY' para que pisen exacto la línea.
        const EQUIPOS = [
            { id: 1, nombre: "M. JACKSON", asset: "jackson.png", posicionY: "32%", audioVictoria: "canciones/jackson.mp3" },
            { id: 2, nombre: "F. MERCURY", asset: "mercury.png", posicionY: "48%", audioVictoria: "canciones/mercury.mp3" },
            { id: 3, nombre: "SLASH", asset: "slash.png", posicionY: "64%", audioVictoria: "canciones/slash.mp3" },
            { id: 4, nombre: "D. BOWIE", asset: "bowie.png", posicionY: "78%", audioVictoria: "canciones/bowie.mp3" },
            { id: 5, nombre: "A. WINEHOUSE", asset: "winehouse.png", posicionY: "92%", audioVictoria: "canciones/winehouse.mp3" }
        ];

        let datosEq = {}, anteriorClicks = {}, posiciones = {};
        let snapshotJugadores = {}; 
        let juegoActivo = false, clasificacion = [];
        let factorVel = 1, enTension = false;
        const LIMITE_IZQUIERDO_META = 85; // Ajustado al láser rojo de tu imagen

        // Sistema de Audio
        const audioLobby = new Audio('canciones/lobby.mp3'); audioLobby.loop = true;
        const audioCarrera = new Audio('canciones/carrera.mp3'); audioCarrera.loop = true;
        let audioGanadorActual = null;

        window.desbloquearSistema = () => {
            document.getElementById('pantalla-desbloqueo').style.display = 'none';
            document.getElementById('overlay-inicio').style.display = 'flex';
            audioLobby.play().catch(e => console.log("Audio prevent by browser"));
            resetDB();
        };

        function resetDB() {
            set(ref(db, 'estado'), 'espera');
            set(ref(db, 'ganadorAbsoluto'), null); 
            const inicial = {};
            EQUIPOS.forEach(eq => { 
                inicial[eq.id] = { clicksTotales: 0 }; 
                posiciones[eq.id] = 0; anteriorClicks[eq.id] = 0; snapshotJugadores[eq.id] = 0;
            });
            set(ref(db, 'equipos'), inicial);
        }

        onValue(ref(db, 'equipos'), (snap) => { datosEq = snap.val() || {}; });

        const zonaCarriles = document.getElementById('zona-carriles');
        EQUIPOS.forEach((eq) => {
            const carril = document.createElement('div');
            carril.className = 'carril';
            carril.style.top = eq.posicionY; // Aplica la posición vertical
            carril.innerHTML = `<div class="personaje" id="p-${eq.id}"><img src="${eq.asset}" alt="${eq.nombre}"></div>`;
            zonaCarriles.appendChild(carril);
        });

        // Escucha comandos del panel Admin
        onValue(ref(db, 'comandoReset'), (snap) => { if(snap.val()) location.reload(); });

        onValue(ref(db, 'comandoInicio'), (snap) => {
            if(snap.val() && !juegoActivo) {
                document.getElementById('titulo-inicio').style.display = 'none';
                const tv = document.getElementById('contador-tv'); tv.style.display = 'block';
                set(ref(db, 'estado'), 'cuenta_regresiva');
                
                audioLobby.pause(); audioLobby.currentTime = 0;
                
                let num = 3; tv.innerText = num;
                const int = setInterval(() => {
                    num--; if(num>0) tv.innerText = num;
                    else { 
                        clearInterval(int); tv.innerText = "GO!"; 
                        EQUIPOS.forEach(eq => {
                            const data = datosEq[eq.id];
                            snapshotJugadores[eq.id] = (data && data.jugadores) ? Object.keys(data.jugadores).length : 0;
                        });
                        setTimeout(() => { 
                            document.getElementById('overlay-inicio').style.display = 'none';
                            set(ref(db, 'estado'), 'carrera'); 
                            juegoActivo = true; 
                            audioCarrera.play();
                        }, 500); 
                    }
                }, 1000);
            }
        });

        // Escucha el gatillo de la ruleta desde el admin
        onValue(ref(db, 'triggerRuleta'), (snap) => {
            if(snap.val() && clasificacion.length > 0) {
                document.getElementById('overlay-podio').style.display = 'none';
                ejecutarRuletaDigital(clasificacion[0]); 
            }
        });

        function ejecutarRuletaDigital(idEquipoGanador) {
            const overlayRuleta = document.getElementById('overlay-ruleta');
            const displayNombre = document.getElementById('nombre-ruleta');
            overlayRuleta.style.display = 'flex';
            
            const equipoData = datosEq[idEquipoGanador];
            let nombres = ["NADIE"]; 
            if (equipoData && equipoData.jugadores) { nombres = Object.values(equipoData.jugadores); }
            
            let tiempo = 0; const tiempoMaximo = 3500; const velocidadCambio = 60; 
            displayNombre.classList.add('ruleta-girando');
            
            const intervaloRuleta = setInterval(() => {
                displayNombre.innerText = nombres[Math.floor(Math.random() * nombres.length)];
                tiempo += velocidadCambio;
                
                if (tiempo >= tiempoMaximo) {
                    clearInterval(intervaloRuleta);
                    displayNombre.innerText = nombres[Math.floor(Math.random() * nombres.length)];
                    displayNombre.classList.remove('ruleta-girando');
                    displayNombre.classList.add('ruleta-ganador');
                    
                    setTimeout(() => { overlayRuleta.style.display = 'none'; mostrarPodioEpic(); }, 5000);
                }
            }, velocidadCambio);
        }

        setInterval(() => {
            if(!juegoActivo) return;
            let equiposEnZonaTension = []; 

            EQUIPOS.forEach((eq) => {
                const id = eq.id; const data = datosEq[id]; const jgsActivos = snapshotJugadores[id];
                if(jgsActivos > 0 && !clasificacion.includes(id)) {
                    const nuevosClicks = data.clicksTotales - anteriorClicks[id];
                    const avance = (nuevosClicks / jgsActivos) * 5 * factorVel; 
                    
                    posiciones[id] += avance; anteriorClicks[id] = data.clicksTotales;
                    const visualLeft = (posiciones[id] / 1000) * LIMITE_IZQUIERDO_META;
                    const el = document.getElementById(`p-${id}`);
                    el.style.left = Math.min(visualLeft, 95) + "vw";

                    if (posiciones[id] >= 900 && posiciones[id] < 1000) equiposEnZonaTension.push(id);

                    if (posiciones[id] >= 1000) {
                        clasificacion.push(id);
                        el.style.filter = "drop-shadow(0 0 20px #fff)"; 

                        if (clasificacion.length === 1) {
                            set(ref(db, 'ganadorAbsoluto'), id);
                            juegoActivo = false; 
                            audioCarrera.pause(); audioCarrera.currentTime = 0;
                            
                            audioGanadorActual = new Audio(eq.audioVictoria);
                            audioGanadorActual.play().catch(e=>console.log(e));

                            setTimeout(() => {
                                document.getElementById('pista-container').style.transform = `scale(1) translateX(0)`;
                                document.body.classList.remove('efecto-tension');
                                set(ref(db, 'estado'), 'espera'); 
                                mostrarPodioEpic(); // Solo muestra el podio, la ruleta se lanza desde el Admin
                            }, 1500);
                        }
                    }
                }
            });

            // Lógica de Tensión y Zoom
            const contenedor = document.getElementById('pista-container');
            if (equiposEnZonaTension.length > 0 && !enTension && clasificacion.length === 0) {
                enTension = true; factorVel = 0.3; document.body.classList.add('efecto-tension');
                if (equiposEnZonaTension.length === 1) {
                    const eqLider = EQUIPOS.find(e => e.id === equiposEnZonaTension[0]);
                    contenedor.style.transformOrigin = `85vw ${eqLider.posicionY}`; 
                    contenedor.style.transform = `scale(2.5) translateX(-2vw)`; 
                } else {
                    contenedor.style.transformOrigin = `80vw 50vh`; 
                    contenedor.style.transform = `scale(1.8) translateX(-5vw)`; 
                }
            } else if (equiposEnZonaTension.length === 0 && clasificacion.length > 0 && enTension) {
                 contenedor.style.transform = `scale(1) translateX(0)`;
                 document.body.classList.remove('efecto-tension');
                 factorVel = 1; enTension = false;
            }
        }, 100);

        function mostrarPodioEpic() {
            const podioDiv = document.getElementById('overlay-podio');
            const lista = document.getElementById('lista-podio');
            podioDiv.style.display = 'flex';
            lista.innerHTML = ''; // Limpiar lista previa

            clasificacion.forEach((id, idx) => {
                if(idx < 3) {
                    const item = document.createElement('div');
                    item.className = 'puesto';
                    const nombreEq = EQUIPOS.find(e => e.id === id).nombre;
                    item.innerHTML = `<span style="color: #fff; text-shadow: 0 0 10px var(--neon-red);">#${idx+1}</span> <span>${nombreEq}</span>`;
                    lista.appendChild(item);
                }
            });
        }
    </script>
</body>
</html>
