<!DOCTYPE html>
<html lang="es">
<head>
    <title>Controller - Legends Sprint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        :root { --neon-red: #EC0000; --dark-bg: #0a0a0a; --oro: #FFD700; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Arial Black', sans-serif; color: #fff; overflow: hidden; touch-action: none; background: var(--dark-bg); }
        .con-fondo { background: url('fondo.png') center center / cover no-repeat; background-color: var(--dark-bg); }
        
        /* Modal Glassmorphism unificado */
        .panel-glass { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); border: 2px solid var(--neon-red); box-shadow: 0 0 20px rgba(236, 0, 0, 0.5); border-radius: 15px; padding: 25px 15px; width: 90%; max-width: 320px; text-align: center; margin: 0 auto; transition: all 0.3s ease;}
        
        .pantalla { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; position: absolute; top: 0; left: 0; }
        .activa { display: flex; animation: aparecer 0.3s ease-out; }
        @keyframes aparecer { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        #overlay-contador { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; justify-content: center; align-items: center; }
        #contador-gigante-movil { font-size: 150px; font-family: 'Press Start 2P', cursive; color: var(--neon-red); text-shadow: 0 0 40px var(--neon-red); animation: latido 1s infinite; transition: font-size 0.2s;}
        
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 16px; font-family: 'Press Start 2P', cursive; text-transform: uppercase; line-height: 1.5; color: #fff; text-shadow: 0 0 10px var(--neon-red); }
        input { padding: 15px; font-size: 16px; border: 2px solid #333; border-radius: 8px; width: 85%; text-align: center; font-weight: bold; margin-bottom: 15px; outline: none; background: rgba(0,0,0,0.5); color: #fff; text-transform: uppercase; box-sizing: border-box;}
        input:focus { border-color: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); }
        .btn-accion { padding: 15px 20px; font-size: 14px; font-family: 'Press Start 2P', cursive; border: none; background: var(--neon-red); color: #fff; cursor: pointer; border-radius: 8px; width: 85%; text-transform: uppercase; box-shadow: 0 0 15px var(--neon-red); transition: transform 0.1s; margin-top: 10px;}
        .btn-accion:active { transform: scale(0.95); }
        
        .caja-instrucciones { background: rgba(236,0,0,0.2); border: 2px solid var(--neon-red); border-radius: 10px; padding: 20px; margin-bottom: 25px; box-shadow: inset 0 0 15px rgba(236,0,0,0.3); }
        #instruccion-personalizada { color: #fff; font-size: 14px; line-height: 1.6; margin: 0; text-shadow: 1px 1px 2px #000; }
        
        #zona-tap { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; border: 8px solid var(--neon-red); box-sizing: border-box; background: rgba(236, 0, 0, 0.15); backdrop-filter: blur(5px); transition: background 0.3s;}
        #mensaje-tap { font-size: 30px; font-family: 'Press Start 2P', cursive; text-align: center; color: white; text-shadow: 0 0 20px var(--neon-red), 2px 2px 0 #000; pointer-events: none; line-height: 1.5; z-index: 10;}
        
        .parpadeo-lento { animation: pulso-lento 1.5s infinite alternate; }
        @keyframes pulso-lento { from { opacity: 0.3; transform: scale(1); } to { opacity: 1; transform: scale(1.05); } }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        /* Modificadores de Celebración */
        .victoria-flash { animation: flashRW 0.2s infinite !important; background: #EC0000; z-index: 9999;}
        @keyframes flashRW { 0% { background: #EC0000; } 50% { background: #fff; } 100% { background: #EC0000; } }
        
        .ruleta-ganador-modo { animation: flashOro 0.2s infinite !important; }
        @keyframes flashOro { 0% { background: #000; } 50% { background: var(--oro); } 100% { background: #000; } }
        
        /* Latido del panel al cruzar la meta */
        .panel-latido { animation: sombra-latido 1.5s infinite alternate; }
        @keyframes sombra-latido { from { box-shadow: 0 0 10px rgba(236, 0, 0, 0.3); } to { box-shadow: 0 0 30px rgba(236, 0, 0, 0.8); } }
        
        /* Titulo Oro para ganadores */
        .titulo-oro { color: var(--oro) !important; text-shadow: 0 0 15px var(--oro) !important; }

        .texto-rojo-inverso { color: #EC0000 !important; text-shadow: 2px 2px 0 #000 !important; }
        .texto-blanco-puro { color: #fff !important; text-shadow: 2px 2px 0 #000 !important; }
        .texto-negro-inverso { color: #000 !important; text-shadow: none !important; }
        
        .derrota { filter: grayscale(100%); opacity: 0.7; pointer-events: none; }
        .img-equipo { width: 80px; height: 80px; object-fit: contain; margin: 10px auto; filter: drop-shadow(0 0 10px var(--neon-red));}
        
        .flotante { position: absolute; color: #fff; font-family: 'Press Start 2P', cursive; pointer-events: none; animation: subirAleatorio 0.5s ease-out forwards; text-shadow: 0 0 10px var(--neon-red), 2px 2px 0 #000; }
        @keyframes subirAleatorio { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
    </style>
</head>
<body class="con-fondo">

    <div id="pantalla-nombre" class="pantalla activa">
        <div class="panel-glass">
            <h2>START GAME</h2>
            <input type="number" id="input-pin" placeholder="PIN SALA" maxlength="4" autocomplete="off">
            <input type="text" id="input-nombre" placeholder="TU NOMBRE" maxlength="12" autocomplete="off">
            <button class="btn-accion" onclick="intentarIngreso()">INGRESAR</button>
            <p id="msg-error" style="color: #ff5555; font-size: 12px; margin-top: 15px; font-family: 'Arial Black'; display: none;"></p>
        </div>
    </div>

    <div id="pantalla-espera" class="pantalla">
        <div class="panel-glass">
            <h1 id="txt-bienvenida" style="color: #fff; font-size: 14px; font-family: 'Press Start 2P', cursive; margin-top: 0; line-height: 1.4;">...</h1>
            <h2 style="font-size: 12px; color:#aaa; margin-bottom:5px; margin-top: 20px;">ESTÁS EN EL EQUIPO:</h2>
            <img id="img-personaje" class="img-equipo" src="" alt="Personaje">
            <h2 id="nombre-equipo-asignado" style="color: var(--neon-red); font-size: 16px; font-family: 'Press Start 2P', cursive; text-shadow: 0 0 10px var(--neon-red); margin-bottom: 20px;">...</h2>
            
            <div class="caja-instrucciones">
                <p id="instruccion-personalizada">...</p>
            </div>
            <p id="texto-estado-espera" class="parpadeo-lento" style="color: var(--neon-red); font-size: 14px; font-family: 'Press Start 2P', cursive; margin-bottom: 0;">ATENTO A LA PANTALLA DEL EVENTO</p>
        </div>
    </div>

    <div id="overlay-contador">
        <div id="contador-gigante-movil">3</div>
    </div>

    <!-- Nueva Pantalla de Llegada / Resultados (Acorde al Key Visual) -->
    <div id="pantalla-llegada" class="pantalla">
        <div id="panel-resultados" class="panel-glass panel-latido">
            <h1 id="titulo-llegada" style="font-family: 'Press Start 2P', cursive; font-size: 18px; color: #fff; text-shadow: 0 0 10px var(--neon-red); margin-top: 0; margin-bottom: 25px; line-height: 1.5;">¡MISION<br>CUMPLIDA!</h1>
            <h2 id="txt-meta-nombre" style="font-family: 'Arial Black'; font-size: 18px; color: #fff; margin-bottom: 20px; text-transform: uppercase;">...</h2>
            
            <div class="caja-instrucciones" style="margin-bottom: 0;">
                <p id="txt-meta-desc" style="font-family: 'Arial Black'; font-size: 13px; color: #ddd; line-height: 1.6; margin: 0;">Tu equipo ha cruzado la línea de meta.<br><br>Mantente atento a la pantalla principal mientras los demás terminan la carrera.</p>
            </div>
        </div>
    </div>

    <div id="pantalla-juego" class="pantalla" style="padding: 0;">
        <div id="zona-tap">
            <div id="mensaje-tap" class="parpadeo-lento">TAP<br>RÁPIDO</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, update, set, increment, onDisconnect, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAlvRSjQ8HMkYLqWdRnz8sHm6H1anXxNUw", authDomain: "hipodromo-56215.firebaseapp.com", databaseURL: "https://hipodromo-56215-default-rtdb.firebaseio.com", projectId: "hipodromo-56215", storageBucket: "hipodromo-56215.firebasestorage.app", messagingSenderId: "793993929295", appId: "1:793993929295:web:febbad383d625d60c3c03a" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let miNombre = "", miPila = "", miEquipo = null, estadoActual = 'cerrado', pinActivo = null;
        const miID = Math.random().toString(36).substring(2, 10); 
        const EQUIPOS_DATA = [
            { nombre: "M. JACKSON", img: "jackson.png" },
            { nombre: "F. MERCURY", img: "mercury.png" },
            { nombre: "SLASH", img: "slash.png" },
            { nombre: "D. BOWIE", img: "bowie.png" },
            { nombre: "A. WINEHOUSE", img: "winehouse.png" }
        ];
        
        const zonaTap = document.getElementById('zona-tap'); 
        const msj = document.getElementById('mensaje-tap');
        const overlayContador = document.getElementById('overlay-contador');
        const contadorGigante = document.getElementById('contador-gigante-movil');
        const pantallaLlegada = document.getElementById('pantalla-llegada');
        
        const VOLUMEN_MAX = 0.7;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function reproducirPop() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(VOLUMEN_MAX, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function reproducirBeep(frecuencia) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime); 
            gain.gain.setValueAtTime(VOLUMEN_MAX * 0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        onValue(ref(db, 'salaActiva'), (snap) => { pinActivo = snap.val(); });

        window.intentarIngreso = () => {
            const pinVal = document.getElementById('input-pin').value.trim();
            const nomVal = document.getElementById('input-nombre').value.trim();
            const msgError = document.getElementById('msg-error');
            
            if(!pinActivo) { msgError.innerText = "No hay salas abiertas."; msgError.style.display = 'block'; return; }
            if(pinVal !== pinActivo) { msgError.innerText = "PIN incorrecto."; msgError.style.display = 'block'; return; }
            if(!nomVal) { msgError.innerText = "Ingresa tu nombre."; msgError.style.display = 'block'; return; }
            
            miNombre = nomVal.toUpperCase(); 
            miPila = miNombre.split(' ')[0]; 
            
            document.getElementById('pantalla-nombre').classList.remove('activa');
            if(audioCtx.state === 'suspended') audioCtx.resume(); 
            asignarEquipoAleatorio();
        };

        function asignarEquipoAleatorio() {
            miEquipo = Math.floor(Math.random() * 5) + 1;
            construirUIEspera();
            set(ref(db, `equipos/${miEquipo}/jugadores/${miID}`), miNombre);
            onDisconnect(ref(db, `equipos/${miEquipo}/jugadores/${miID}`)).remove();
            evaluarPantalla();
        }

        function construirUIEspera() {
            const dataEq = EQUIPOS_DATA[miEquipo - 1];
            document.getElementById('txt-bienvenida').innerText = `¡HOLA ${miPila}!`;
            document.getElementById('img-personaje').src = dataEq.img;
            document.getElementById('nombre-equipo-asignado').innerText = dataEq.nombre;
            document.getElementById('instruccion-personalizada').innerHTML = `<strong>¡ATENCIÓN!</strong><br><br>Ayuda a <strong>${dataEq.nombre}</strong> a llegar a la meta antes que todos tocando la pantalla lo más rápido posible.`;
        }

        onValue(ref(db, 'comandoResetCelulares'), async (snap) => {
            if(!miNombre) return;
            const snapEqs = await get(ref(db, 'equipos'));
            const datos = snapEqs.val();
            [1,2,3,4,5].forEach(id => {
                if(datos[id].jugadores && datos[id].jugadores[miID]) {
                    miEquipo = id;
                    construirUIEspera();
                }
            });
        });

        let cuentaAtrasInterval = null;
        let yaCruzoMeta = false;
        let timerFlash = null;
        let rankingMostrado = false;
        let rankingGlobal = [];

        onValue(ref(db, 'clasificacion'), (snapshot) => {
            rankingGlobal = snapshot.val() || [];
            
            // Cuando mi equipo cruza la meta por primera vez
            if (rankingGlobal.includes(miEquipo) && estadoActual === 'carrera' && !yaCruzoMeta) {
                yaCruzoMeta = true;
                document.getElementById('titulo-llegada').innerText = "¡MISION CUMPLIDA!";
                document.getElementById('titulo-llegada').className = "";
                document.getElementById('txt-meta-nombre').innerText = `EXCELENTE, ${miPila}`;
                document.getElementById('txt-meta-desc').innerHTML = `Tu equipo ha cruzado la línea de meta.<br><br>Mantente atento a la pantalla principal mientras los demás terminan la carrera.`;
                pantallaLlegada.classList.add('activa');
                document.getElementById('pantalla-juego').classList.remove('activa');
            }
            
            verificarVictoria();
        });

        onValue(ref(db, 'estado'), (snapshot) => {
            estadoActual = snapshot.val() || 'cerrado';
            if(estadoActual === 'cerrado' && miNombre !== "") { location.reload(); }
            evaluarPantalla();
        });

        function evaluarPantalla() {
            if(miNombre === "") return; 
            
            document.getElementById('pantalla-espera').classList.remove('activa');
            document.getElementById('pantalla-juego').classList.remove('activa');
            overlayContador.style.display = 'none';
            
            if (estadoActual !== 'podio') {
                pantallaLlegada.classList.remove('activa');
            }

            clearInterval(cuentaAtrasInterval);
            clearTimeout(timerFlash);

            if(estadoActual === 'espera') {
                yaCruzoMeta = false; rankingMostrado = false;
                zonaTap.className = ""; msj.className = "";
                document.getElementById('pantalla-espera').classList.add('activa');
            } 
            else if (estadoActual === 'cuenta_regresiva') {
                document.getElementById('pantalla-juego').classList.add('activa');
                overlayContador.style.display = 'flex'; 
                contadorGigante.style.fontSize = "150px";
                let num = 3; contadorGigante.innerText = num;
                reproducirBeep(440);
                cuentaAtrasInterval = setInterval(() => {
                    num--; 
                    if(num > 0) {
                        contadorGigante.innerText = num;
                        reproducirBeep(440);
                    } else { 
                        contadorGigante.style.fontSize = "80px"; 
                        contadorGigante.innerText = "GO!"; 
                        reproducirBeep(880);
                        clearInterval(cuentaAtrasInterval); 
                    }
                }, 1000);
            } 
            else if (estadoActual === 'carrera') {
                overlayContador.style.display = 'none'; 
                if(!yaCruzoMeta) {
                    msj.innerHTML = "TAP<br>RÁPIDO";
                    msj.style.fontSize = "30px";
                    msj.className = "parpadeo-lento";
                    document.getElementById('pantalla-juego').classList.add('activa');
                } else {
                    document.getElementById('titulo-llegada').innerText = "¡MISION CUMPLIDA!";
                    document.getElementById('titulo-llegada').className = "";
                    document.getElementById('txt-meta-nombre').innerText = `EXCELENTE, ${miPila}`;
                    document.getElementById('txt-meta-desc').innerHTML = `Tu equipo ha cruzado la línea de meta.<br><br>Mantente atento a la pantalla principal mientras los demás terminan la carrera.`;
                    pantallaLlegada.classList.add('activa');
                }
            }
            else if (estadoActual === 'podio') {
                verificarVictoria();
            }
        }

        function verificarVictoria() {
            if (estadoActual === 'podio' && rankingGlobal.length > 0 && !rankingMostrado) {
                rankingMostrado = true;
                pantallaLlegada.classList.remove('activa');
                document.getElementById('pantalla-juego').classList.add('activa');

                if (rankingGlobal[0] === miEquipo) { 
                    zonaTap.className = "victoria-flash"; 
                    msj.innerHTML = "¡GANAMOS!"; 
                    msj.style.fontSize = "40px";
                    msj.className = "texto-rojo-inverso";
                    if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000, 500, 2000]); 
                    
                    timerFlash = setTimeout(() => {
                        if(estadoActual === 'podio' && zonaTap.className !== "ruleta-ganador-modo") {
                            zonaTap.className = "";
                            document.getElementById('pantalla-juego').classList.remove('activa');
                            
                            // Modal actualizado para ganadores
                            document.getElementById('titulo-llegada').innerText = "¡1ER LUGAR!";
                            document.getElementById('titulo-llegada').className = "titulo-oro";
                            document.getElementById('txt-meta-nombre').innerText = `¡CAMPEONES, ${miPila}!`;
                            document.getElementById('txt-meta-desc').innerHTML = `Tu equipo fue el más rápido de la pista.<br><br>Atento a la <strong>RULETA</strong> en la pantalla principal para el gran premio final.`;
                            pantallaLlegada.classList.add('activa');
                        }
                    }, 5000);

                } else { 
                    zonaTap.className = "";
                    document.getElementById('pantalla-juego').classList.remove('activa');
                    
                    // Modal actualizado para el resto
                    document.getElementById('titulo-llegada').innerText = "¡CARRERA FINALIZADA!";
                    document.getElementById('titulo-llegada').className = "";
                    document.getElementById('txt-meta-nombre').innerText = `PUESTO #${rankingGlobal.indexOf(miEquipo) + 1}`;
                    document.getElementById('txt-meta-desc').innerHTML = `Gracias por tu energía, ${miPila}.<br><br>Mantente atento a la ruleta del equipo ganador en la pantalla principal.`;
                    pantallaLlegada.classList.add('activa');
                }
            }
        }

        onValue(ref(db, 'ganadorRuleta'), (snap) => {
            const uidGanador = snap.val();
            if(uidGanador && uidGanador === miID) {
                clearTimeout(timerFlash);
                pantallaLlegada.classList.remove('activa');
                document.getElementById('pantalla-juego').classList.add('activa');
                
                zonaTap.className = "ruleta-ganador-modo";
                msj.innerHTML = `¡ERES EL<br>ELEGIDO!<br><br><span style="font-size:14px; color:#000;">PASA AL ESCENARIO</span>`;
                msj.className = "texto-negro-inverso";
                
                if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200, 100, 1000, 500, 2000, 500, 2000]);
                reproducirBeep(1000); setTimeout(()=>reproducirBeep(1200), 200); setTimeout(()=>reproducirBeep(1500), 400);
            }
        });

        let clicksAcumulados = 0;
        let enviandoBatch = false;

        zonaTap.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            if(estadoActual !== 'carrera' || yaCruzoMeta) return; 
            if (e.touches.length > 1) return;

            reproducirPop(); 
            if (navigator.vibrate) navigator.vibrate(15); 
            
            for (let i = 0; i < e.changedTouches.length; i++) {
                const num = document.createElement('div'); 
                num.className = 'flotante'; 
                num.innerText = '+1';
                const tamaño = Math.floor(Math.random() * (60 - 30 + 1)) + 30; 
                num.style.fontSize = tamaño + 'px'; 
                const randX = Math.floor(Math.random() * 80) + 10;
                const randY = Math.floor(Math.random() * 80) + 10;
                num.style.left = randX + '%'; num.style.top = randY + '%';
                zonaTap.appendChild(num); setTimeout(() => num.remove(), 500);
            }

            clicksAcumulados++;
            if (!enviandoBatch) {
                enviandoBatch = true;
                setTimeout(() => {
                    if (clicksAcumulados > 0) {
                        update(ref(db, `equipos/${miEquipo}`), { clicksTotales: increment(clicksAcumulados) }); 
                        clicksAcumulados = 0;
                    }
                    enviandoBatch = false;
                }, 400); 
            }
        });
    </script>
</body>
</html>
